<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi sitio en Render</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 10vh auto;
      padding: 0 1rem;
      line-height: 1.6;
      color: #222;
    }
    h1 { margin-bottom: .25rem; }
    .card {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-top: 1.5rem;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #eee; }
      .card { border-color: #333; }
    }
  </style>
</head>
<body>
  <h1>¡Hola, mundo! 👋</h1>
  <p>Este sitio está corriendo en Render.</p>
  <div class="card">
    <strong>Hora de tu navegador:</strong>
    <span id="hora"></span>
  </div>
  <script>
    document.getElementById("hora").textContent = new Date().toLocaleString("es-MX");
  </script>
</body>
</html>
